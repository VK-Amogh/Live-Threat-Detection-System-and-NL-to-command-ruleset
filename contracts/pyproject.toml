[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "td_contracts"
version = "0.1.0"
description = "Canonical contracts and wire models for SafeSpace video threat detection system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/td_contracts"]
