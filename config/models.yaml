# Weights listed here are loaded if the file exists. Class names come from the weights themselves and
# alert thresholds from the calibration sidecar next to each file (storage/models/<weights>.json),
# written by scripts/benchmark_detector.py when a candidate is promoted.
models:
  - name: weapons
    path: storage/models/weapons.pt
    imgsz: 640   # the verifier was trained on proposals made at this size (the benchmark used 704; keep config and verifier consistent)

verifier:
  weights: storage/models/verifier.pt        # DINOv2 crop re-scorer; thresholds in the .json sidecar. Remove this block to fall back to raw YOLO thresholds.

violence:
  head: storage/models/violence_head.pt     # DINOv2-base encoder + temporal head (scene/pose; also scores single stills), thresholds in the .json sidecar
  motion: storage/models/violence_videomae.pt      # VideoMAE-K400 + head (motion over ~3 s); used for video/live together with `head`
  ensemble: storage/models/violence_ensemble.json  # logistic stack of both scores (coefficients + threshold fitted on validation clips)

inference:
  image_size: 640
  floor_confidence: 0.10   # proposals below this never reach the verifier; the verifier was trained on proposals >= this floor
  device: auto

# Categories this system cannot reliably detect from object boxes or short clips.
unsupported:
  - "Fire and smoke, including Arson (removed: detection on low-resolution CCTV was not reliable enough)"
  - "Crime-type labels (Abuse, Arrest, Assault, Burglary, Explosion, Fighting, RoadAccidents, Robbery, Shooting, Shoplifting, Stealing, Vandalism): a classifier was trained and scored on blind DCSASS videos and no type met the surfacing bar (docs/crime-type.md); storage/models/crime_type.* is evaluation-only and is not loaded by this service"
  - Falls and medical emergencies
  - Robbery, theft or criminal intent
  - Intrusion without a configured restricted zone
  - Explosives and concealed weapons
  - Fights outside what the violence recogniser was trained on (e.g. night-time, very distant crowds)
