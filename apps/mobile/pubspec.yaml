name: safespace_mobile
description: SafeSpace Android-first mobile client for real-time threat notifications, local WebSocket streaming, and cloud sync.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.4.3+1
  web_socket_channel: ^3.0.0
  flutter_local_notifications: ^17.2.1
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3
  file_picker: ^10.3.0
  image_picker: ^1.2.0
  camera: ^0.11.2
  video_player: ^2.10.0
  flutter_svg: ^2.2.0
  intl: ^0.19.0
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
  fonts:
    - family: AppSerif
      fonts:
        - asset: assets/fonts/Arapey-Regular.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
