[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "safespace_inference"
version = "0.1.0"
description = "Inference worker service for SafeSpace video threat detection system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "td_contracts",
    "ultralytics>=8.2.0",
    "opencv-python-headless>=4.9.0",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.7.0",
]
